[package]
name = "poe-graft"
description = "Over-roll protection for Path of Exile 1 crafting."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "poe-graft"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which otherwise collides on
# Windows (rust-lang/cargo#8519).
name = "poe_graft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Only here to stamp log lines with a local wall-clock time. The human on the gaming PC needs to
# compare "when did I merge" against "when did the app check", and epoch milliseconds do not
# answer that question.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
poe-graft-core = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
poe-graft-win32 = { workspace = true }
